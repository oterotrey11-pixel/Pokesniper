
name: PokeSniper Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send test notification"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python test_notify.py

      - name: Monitor products
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pokesniper.py

      - name: Save monitoring history
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: |
          git config user.name "PokeSniper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (
            git commit -m "Update monitoring state"
            git push
          )
